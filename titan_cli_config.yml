# Titan CLI config (YAML) - generated from iac/manifest.py
# This file contains resource definitions only. Supply Snowflake credentials via
# environment variables (SNOWFLAKE_ACCOUNT, SNOWFLAKE_USER, SNOWFLAKE_PASSWORD,
# SNOWFLAKE_ROLE) so the Titan CLI can authenticate.

# Resource definitions
databases:
  - name: SCHEMA_EVOLUTION_DB
    owner: SYSADMIN
    comment: "Schema evolution demo database"
    schemas:
      - name: RAW
        owner: SYSADMIN
        comment: "Raw landing schema"
      - name: STAGING
        owner: SYSADMIN
        comment: "Staging schema for transformations"
      - name: INTERMEDIATE
        owner: SYSADMIN
        comment: "Intermediate schema for enrichments"
      - name: MARTS
        owner: SYSADMIN
        comment: "Analytics marts"
      - name: SNAPSHOTS
        owner: SYSADMIN
        comment: "Snapshot storage"

# Tables managed by Titan via SQL (Titan will parse SQL strings into table resources)
iceberg_tables:
  - name: RAW.WEATHER_FORECASTS_ICEBERG
    columns:
      - name: city
        data_type: VARCHAR(134217728)
      - name: latitude
        data_type: FLOAT
      - name: longitude
        data_type: FLOAT
      - name: forecast_date
        data_type: DATE
      - name: temperature_2m_max
        data_type: FLOAT
      - name: temperature_2m_min
        data_type: FLOAT
      - name: apparent_temperature_max
        data_type: FLOAT
      - name: apparent_temperature_min
        data_type: FLOAT
      - name: sunrise
        data_type: VARCHAR(134217728)
      - name: sunset
        data_type: VARCHAR(134217728)
      - name: ingested_at
        data_type: TIMESTAMP_NTZ
    comment: "Daily weather forecasts - Iceberg table with explicit schema"
    owner: SYSADMIN

  - name: RAW.WEATHER_HOURLY_ICEBERG
    columns:
      - name: city
        data_type: VARCHAR(134217728)
      - name: latitude
        data_type: FLOAT
      - name: longitude
        data_type: FLOAT
      - name: timestamp
        data_type: TIMESTAMP_NTZ
      - name: temperature_2m
        data_type: FLOAT
      - name: relative_humidity_2m
        data_type: FLOAT
      - name: apparent_temperature
        data_type: FLOAT
      - name: ingested_at
        data_type: TIMESTAMP_NTZ
    comment: "Hourly weather observations - Iceberg table with explicit schema"
    owner: SYSADMIN

# warehouses: (optional) configure compute here if you want Titan to manage it
warehouses:
  - name: COMPUTE_WH
    warehouse_size: XSMALL
    auto_suspend: 60
    auto_resume: true
    comment: "Default compute for schema evolution project"

# Optional: vars or additional config can be added here
