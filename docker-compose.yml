# =============================================================================
# Docker Compose — Design for Schema Evolution
# =============================================================================
# Usage:
#   docker compose run extract         # Run dlt extraction (V1)
#   docker compose run extract-v2      # Run dlt extraction (V2 - evolved schema)
#   docker compose run dbt-run         # Run dbt models
#   docker compose run dbt-test        # Run dbt tests
# =============================================================================

services:
  # ─── Base service (shared config) ─────────────────────────────────────────
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DBT_PROFILES_DIR=/app/transform
    volumes:
      - ./extract:/app/extract
      - ./transform:/app/transform
      - ./load:/app/load

  # ─── Extraction: dlt → Snowflake (V1 schema) ─────────────────────────────
  extract:
    extends:
      service: pipeline
    command: python -m extract.open_meteo_pipeline --schema-version 1

  # ─── Extraction: dlt → Snowflake (V2 evolved schema) ─────────────────────
  extract-v2:
    extends:
      service: pipeline
    command: python -m extract.open_meteo_pipeline --schema-version 2

  # ─── Transformation: dbt run ──────────────────────────────────────────────
  dbt-run:
    extends:
      service: pipeline
    working_dir: /app/transform
    command: dbt run --profiles-dir .

  # ─── Transformation: dbt test ─────────────────────────────────────────────
  dbt-test:
    extends:
      service: pipeline
    working_dir: /app/transform
    command: dbt test --profiles-dir .

  # ─── Transformation: dbt build (run + test) ──────────────────────────────
  dbt-build:
    extends:
      service: pipeline
    working_dir: /app/transform
    command: dbt build --profiles-dir .

  # ─── Seeds ────────────────────────────────────────────────────────────────
  dbt-seed:
    extends:
      service: pipeline
    working_dir: /app/transform
    command: dbt seed --profiles-dir .

  # ─── Generate docs ───────────────────────────────────────────────────────
  dbt-docs:
    extends:
      service: pipeline
    working_dir: /app/transform
    command: dbt docs generate --profiles-dir .
    ports:
      - "8080:8080"
