[project]
name = "design-for-schema-evolution"
version = "0.1.0"
description = "Hands-on project demonstrating schema evolution in analytics pipelines using dlt, Snowflake Iceberg tables, and dbt."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}

dependencies = [
    "dlt>=1.0.0",
    "duckdb>=0.9.0",
    "dbt-core>=1.7.0,<1.9.0",
    "dbt-duckdb>=1.7.0,<2.0.0",
    "boto3>=1.26.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
    "pre-commit>=3.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "extract/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["extract"]
