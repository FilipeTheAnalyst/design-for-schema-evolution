# =============================================================================
# Deploy Pipeline — Run extraction and transformations
# =============================================================================
# Triggered manually or on a schedule.
# Runs the full dlt → dbt pipeline against DuckDB + LocalStack S3.
# =============================================================================

name: Deploy Pipeline

on:
  workflow_dispatch:
    inputs:
      schema_version:
        description: 'Schema version to extract (1 = original, 2 = evolved)'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'

  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  
  push:
    branches: [ develop, main ]
    paths:
      - 'extract/**'
      - 'transform/**'

env:
  PYTHON_VERSION: "3.11"
  DUCKDB_DATABASE: ./data/schema_evolution.duckdb
  DUCKDB_SCHEMA: raw
  DBT_PROFILES_DIR: ./transform

jobs:
  extract:
    name: Extract (dlt → DuckDB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv pip install --system ".[dev]"

      - name: Run dlt pipeline
        run: |
          SCHEMA_VERSION=${{ github.event.inputs.schema_version || '1' }}
          python -m extract.open_meteo_pipeline --schema-version "$SCHEMA_VERSION"

      - name: Upload DuckDB database
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-database
          path: ./data/schema_evolution.duckdb

  transform:
    name: Transform (dbt)
    runs-on: ubuntu-latest
    needs: extract
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dbt
        run: uv pip install --system dbt-core dbt-duckdb

      - name: Install dbt packages
        working-directory: transform
        run: dbt deps --profiles-dir .

      - name: Download DuckDB database
        uses: actions/download-artifact@v4
        with:
          name: duckdb-database
          path: ./data

      - name: dbt seed
        working-directory: transform
        run: dbt seed --profiles-dir . --target dev

      - name: dbt build
        working-directory: transform
        run: dbt build --profiles-dir . --target dev

      - name: dbt test results
        if: always()
        working-directory: transform
        run: |
          echo "=== Test Results ==="
          cat target/run_results.json | python -m json.tool || true
