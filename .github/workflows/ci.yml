# =============================================================================
# CI Pipeline — Lint, Test, and Validate
# =============================================================================
# Triggers on pull requests and pushes to develop/main.
# Validates Python code quality and dbt compilation against DuckDB.
# =============================================================================

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ─── Python Lint & Format ─────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv pip install --system ruff

      - name: Ruff check
        run: ruff check extract/

      - name: Ruff format check
        run: ruff format --check extract/

  # ─── dbt Compile (validates SQL without running) ──────────────────────────
  dbt-compile:
    name: dbt Compile (DuckDB)
    runs-on: ubuntu-latest
    needs: lint
    env:
      DBT_PROFILES_DIR: ./transform
      DUCKDB_DATABASE: ./data/schema_evolution.duckdb
      DUCKDB_SCHEMA: ci

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dbt
        run: uv pip install --system dbt-core dbt-duckdb

      - name: Install dbt packages
        working-directory: transform
        run: dbt deps --profiles-dir .

      - name: dbt compile
        working-directory: transform
        run: dbt compile --profiles-dir . --target ci

  # ─── Docker Build ─────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t schema-evolution:ci .

