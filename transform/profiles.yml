# =============================================================================
# dbt profiles.yml — DuckDB Configuration
# =============================================================================
# DuckDB uses a local database file or S3 paths for Iceberg tables.
# Make sure DBT_PROFILES_DIR points here, or copy to ~/.dbt/profiles.yml
# =============================================================================

schema_evolution:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_DATABASE', './data/schema_evolution.duckdb') }}"
      schema: "{{ env_var('DUCKDB_SCHEMA', 'raw') }}"
      threads: 4
      timeout_seconds: 300

    ci:
      type: duckdb
      path: "{{ env_var('DUCKDB_DATABASE', './data/schema_evolution.duckdb') }}"
      schema: "{{ env_var('DUCKDB_SCHEMA', 'ci') }}"
      threads: 4
      timeout_seconds: 300

    iceberg_s3:
      type: duckdb
      path: "s3://schema-evolution-iceberg/duckdb.db"
      schema: "iceberg"
      s3_region: "{{ env_var('AWS_REGION', 'us-east-1') }}"
      s3_access_key_id: "{{ env_var('AWS_ACCESS_KEY_ID', '') }}"
      s3_secret_access_key: "{{ env_var('AWS_SECRET_ACCESS_KEY', '') }}"
      s3_endpoint: "{{ env_var('AWS_ENDPOINT_URL', 'http://localhost:4566') }}"
      threads: 4
      timeout_seconds: 300
